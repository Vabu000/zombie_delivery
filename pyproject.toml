[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "RUF"]
ignore = [
    "B008",      # FastAPI standard dependency injection uses Depends in default arguments
    "RUF001",    # Ambiguous Cyrillic characters in docstrings/strings
    "RUF002",    # Ambiguous Cyrillic characters in docstrings
    "RUF003",    # Ambiguous Cyrillic characters in comments
    "B904",      # Within an `except` clause, raise exceptions with `raise ... from err`
    "E501",      # Line length check (managed by ruff format)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::starlette.testclient.StarletteDeprecationWarning",
    "ignore::DeprecationWarning",
]
